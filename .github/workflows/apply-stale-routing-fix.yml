name: Apply stale routing fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply focused source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "lib/commuteRouting.ts",
              "  nowSec?: number;\n  /** Walk distance in meters from the rider's actual origin (an\n",
              "  nowSec?: number;\n  /** Snapshot `generatedAt` in epoch seconds. When supplied, live\n   *  arrivals are trusted only while the snapshot is under 60 s old;\n   *  stale snapshots fall back to the deterministic non-live model. */\n  liveSnapshotGeneratedAtSec?: number;\n  /** Walk distance in meters from the rider's actual origin (an\n",
          )

          replace_once(
              "lib/commuteRouting.ts",
              "export function hasReachableFirstLegArrival(\n",
              "const LIVE_SNAPSHOT_STALE_AT_SEC = 60;\n\nfunction liveSnapshotIsUsable(options: RankPlanOptions): boolean {\n  const { arrivalsByStation, nowSec, liveSnapshotGeneratedAtSec } = options;\n  if (!arrivalsByStation || typeof nowSec !== \"number\") return false;\n  if (typeof liveSnapshotGeneratedAtSec !== \"number\") return true;\n  if (!Number.isFinite(liveSnapshotGeneratedAtSec)) return false;\n  const ageSec = Math.max(0, nowSec - liveSnapshotGeneratedAtSec);\n  return ageSec < LIVE_SNAPSHOT_STALE_AT_SEC;\n}\n\nexport function hasReachableFirstLegArrival(\n",
          )

          replace_once(
              "lib/commuteRouting.ts",
              "  if (!leg || !arrivalsByStation || typeof nowSec !== \"number\") return null;\n\n  const arrivals = arrivalsByStation.get(leg.boardComplexId);\n",
              "  if (!leg || !arrivalsByStation || typeof nowSec !== \"number\") return null;\n  if (!liveSnapshotIsUsable(options)) return null;\n\n  const arrivals = arrivalsByStation.get(leg.boardComplexId);\n",
          )

          replace_once(
              "lib/commuteRouting.ts",
              "  const haveLive = !!arrivalsByStation && typeof nowSec === \"number\";\n",
              "  const haveLive = liveSnapshotIsUsable(options);\n",
          )

          replace_once(
              "components/NearbyPanel.tsx",
              "      nowSec: now / 1000,\n      preferReachableFirstLeg: true,\n",
              "      nowSec: now / 1000,\n      liveSnapshotGeneratedAtSec: generatedAtSec,\n      preferReachableFirstLeg: true,\n",
          )
          replace_once(
              "components/NearbyPanel.tsx",
              "    arrivalsByStation,\n    now,\n  ]);\n",
              "    arrivalsByStation,\n    now,\n    generatedAtSec,\n  ]);\n",
          )

          search = Path("components/SearchSheet.tsx")
          text = search.read_text()
          needle = "      nowSec: now / 1000,\n"
          if text.count(needle) != 2:
              raise SystemExit(f"SearchSheet: expected two nowSec option entries, found {text.count(needle)}")
          text = text.replace(
              needle,
              "      nowSec: now / 1000,\n      liveSnapshotGeneratedAtSec: generatedAtSec,\n",
          )
          dep1 = "    arrivalsByStation,\n    now,\n    stationsByComplexId,\n  ]);\n"
          if text.count(dep1) != 1:
              raise SystemExit(f"SearchSheet: expected one tripPlans dependency block, found {text.count(dep1)}")
          text = text.replace(
              dep1,
              "    arrivalsByStation,\n    now,\n    generatedAtSec,\n    stationsByComplexId,\n  ]);\n",
              1,
          )
          dep2 = "  }, [tripPlans, arrivalsByStation, now, tripFrom, tripTo, stationsByComplexId]);\n"
          if text.count(dep2) != 1:
              raise SystemExit(f"SearchSheet: expected one fastestPlanMin dependency line, found {text.count(dep2)}")
          text = text.replace(
              dep2,
              "  }, [tripPlans, arrivalsByStation, now, generatedAtSec, tripFrom, tripTo, stationsByComplexId]);\n",
              1,
          )
          search.write_text(text)
          PY

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/commuteRouting.ts components/NearbyPanel.tsx components/SearchSheet.tsx
          git diff --cached --check
          git commit -m "fix(commute): ignore stale realtime snapshots"
          git push origin HEAD:${{ github.head_ref }}
