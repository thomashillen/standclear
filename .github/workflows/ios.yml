name: Native iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build, analyze, and test iOS
    runs-on: macos-26
    # Build, full serial UI coverage and result cleanup exceeded 40 minutes in run 41846703241.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select an installed iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'devices.json').read_text())['devices']
          phones = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if d['name'].startswith('iPhone') and d['isAvailable']]
          if not phones:
              raise SystemExit('No installed iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IOS_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Boot the selected simulator and wait for system startup
        run: xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
      - name: Build, analyze, and test without signing or credentials
        run: |
          xcodebuild -project ios/StandClear.xcodeproj -scheme StandClear \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/StandClearDerived" \
            -resultBundlePath "$RUNNER_TEMP/StandClear.xcresult" \
            -parallel-testing-enabled NO \
            build analyze test CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-ios-results
          path: ${{ runner.temp }}/StandClear.xcresult
          if-no-files-found: ignore
          retention-days: 7
