name: Apply live timing confidence patch

on:
  push:
    branches:
      - fix/commute-timing-confidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/commute-timing-confidence
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply bounded timing-confidence fix
        shell: python
        run: |
          from pathlib import Path

          routing = Path('lib/commuteRouting.ts')
          s = routing.read_text()
          old = 'const LIVE_SNAPSHOT_STALE_AT_SEC = 60;'
          new = 'export const LIVE_SNAPSHOT_STALE_AT_SEC = 60;'
          assert old in s
          routing.write_text(s.replace(old, new, 1))

          panel = Path('components/panelUI.tsx')
          s = panel.read_text()
          old = 'import { estimateTripTimeSec, type TripPlan } from "@/lib/commuteRouting";'
          new = 'import {\n  estimateTripTimeSec,\n  LIVE_SNAPSHOT_STALE_AT_SEC,\n  type TripPlan,\n} from "@/lib/commuteRouting";'
          assert old in s
          s = s.replace(old, new, 1)

          old = '  }, [leg1]);\n\n  const upcoming = useMemo(() => {'
          new = '''  }, [leg1]);\n\n  // Keep the rider-facing confidence boundary aligned with route ranking.\n  // Real callers pass 0 while realtime is unavailable; an omitted prop is\n  // retained as a legacy/test compatibility path.\n  const liveSnapshotFresh = useMemo(() => {\n    if (generatedAtSec === undefined) return true;\n    if (!Number.isFinite(generatedAtSec) || generatedAtSec <= 0) return false;\n    return Math.max(0, now / 1000 - generatedAtSec) < LIVE_SNAPSHOT_STALE_AT_SEC;\n  }, [generatedAtSec, now]);\n\n  const upcoming = useMemo(() => {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      walkFromMeters,\n      walkToMeters,\n    });\n    return Math.max(1, Math.round(sec / 60));\n  }, [plan, leg1, arrivals, now, walkFromMeters, walkToMeters]);'''
          new = '''      walkFromMeters,\n      walkToMeters,\n      liveSnapshotGeneratedAtSec: generatedAtSec,\n    });\n    return Math.max(1, Math.round(sec / 60));\n  }, [plan, leg1, arrivals, now, walkFromMeters, walkToMeters, generatedAtSec]);'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        {/* Total time pill — vibrant, tabular numerals, route-color\n            tinted on the selected plan and quiet otherwise. Pinned\n            to the right of the ribbon so the rider's eye lands on\n            "how long" first. */}'''
          new = '''        <span className={`flex-shrink-0 inline-flex items-center px-1.5 h-[18px] rounded-full ring-1 text-[10px] font-bold uppercase tracking-wide ${\n          liveSnapshotFresh && upcoming.length > 0 && upcomingStaleness[0] == null\n            ? "bg-emerald-300/10 ring-emerald-300/30 text-emerald-200"\n            : "bg-white/[0.05] ring-white/[0.10] text-gray-400"\n        }`}>\n          {liveSnapshotFresh && upcoming.length > 0 && upcomingStaleness[0] == null\n            ? "Live"\n            : "Estimated"}\n        </span>\n        {/* Total time pill — vibrant, tabular numerals, route-color\n            tinted on the selected plan and quiet otherwise. Pinned\n            to the right of the ribbon so the rider's eye lands on\n            "how long" first. */}'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      {upcoming.length === 0 ? (\n        <p className="text-[12px] text-gray-500 leading-snug">'''
          new = '''      {!liveSnapshotFresh ? (\n        <p className="text-[12px] text-gray-500 leading-snug">\n          Live arrivals are unavailable; wait and trip time are estimated.\n        </p>\n      ) : upcoming.length === 0 ? (\n        <p className="text-[12px] text-gray-500 leading-snug">'''
          assert old in s
          panel.write_text(s.replace(old, new, 1))

          tests = Path('components/panelUI.test.tsx')
          s = tests.read_text()
          marker = 'describe("TripPlanRow staleness", () => {\n'
          assert marker in s
          addition = '''describe("TripPlanRow timing confidence", () => {\n  it("labels a fresh matching departure Live and uses its wait in the total", () => {\n    render(\n      <TripPlanRow\n        plan={directLPlan}\n        origin={origin}\n        routeColors={routeColors}\n        stationsByComplexId={stationsByComplexId}\n        arrivals={[makeArrival("trip-live", 60)]}\n        now={NOW_MS}\n        isPrimary={true}\n        generatedAtSec={NOW_SEC}\n      />,\n    );\n    expect(screen.getByText("Live")).toBeTruthy();\n    expect(screen.getByText("4 min")).toBeTruthy();\n    expect(screen.getByText("1m")).toBeTruthy();\n  });\n\n  it("labels a stale snapshot Estimated, falls back to deterministic total, and hides precise countdowns", () => {\n    render(\n      <TripPlanRow\n        plan={directLPlan}\n        origin={origin}\n        routeColors={routeColors}\n        stationsByComplexId={stationsByComplexId}\n        arrivals={[makeArrival("trip-stale", 60)]}\n        now={NOW_MS}\n        isPrimary={true}\n        generatedAtSec={NOW_SEC - 60}\n      />,\n    );\n    expect(screen.getByText("Estimated")).toBeTruthy();\n    expect(screen.getByText("7 min")).toBeTruthy();\n    expect(screen.queryByText("1m")).toBeNull();\n    expect(\n      screen.getByText(/Live arrivals are unavailable; wait and trip time are estimated/),\n    ).toBeTruthy();\n  });\n\n  it("treats the real missing-feed sentinel as Estimated", () => {\n    render(\n      <TripPlanRow\n        plan={directLPlan}\n        origin={origin}\n        routeColors={routeColors}\n        stationsByComplexId={stationsByComplexId}\n        arrivals={[makeArrival("trip-missing", 60)]}\n        now={NOW_MS}\n        isPrimary={true}\n        generatedAtSec={0}\n      />,\n    );\n    expect(screen.getByText("Estimated")).toBeTruthy();\n    expect(screen.getByText("7 min")).toBeTruthy();\n    expect(screen.queryByText("1m")).toBeNull();\n  });\n});\n\n'''
          tests.write_text(s.replace(marker, addition + marker, 1))
      - run: npx vitest run components/panelUI.test.tsx lib/commuteRouting.staleRealtime.test.ts
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/patch-live-confidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/commuteRouting.ts components/panelUI.tsx components/panelUI.test.tsx .github/workflows/patch-live-confidence.yml
          git commit -m "fix(commute): label stale timing as estimated"
          git push origin HEAD:fix/commute-timing-confidence
